[project]
name = "hub-core"
version = "0.1.0"
description = "Backend & API centrale du Personal Data Hub"
authors = [{ name = "Marc", email = "marc.richard4@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.18",
    "cryptography>=44.0.0",  # Fernet pour chiffrer les tokens OAuth en DB
    "pyjwt[crypto]>=2.10.0",  # Validation JWT Cloudflare Access (Phase 0 fin)
    "exifread>=3.0.0",  # Extraction GPS/EXIF photos (Phase 3c+)
    "garminconnect>=0.2.22",  # Garmin Connect sync (Phase 4+)
    "apscheduler>=3.10.4",  # Auto-sync periodique des sources (Phase 6)
    "feedparser>=6.0.11",   # Parsing RSS Google News (Phase 6)
    "pywebpush>=2.0.0",     # Web Push notifications PWA (Phase 6)
    "py-vapid>=1.9.1",      # Genere/signe les VAPID keys (Phase 6)
    "pgvector>=0.3.0",      # Type adapter SQLAlchemy pour Vector(N) - photo_embeddings (Phase 7+)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",  # SQLite async pour tests sans Postgres
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
# ML extras (Phase 7+) : CLIP semantic search photos + face recognition.
# Sur Windows, dlib requiert MSVC Build Tools (visualstudio.microsoft.com).
# Install : pip install -e ".[ml]" (gros telechargement ~3 GB pour torch).
ml = [
    "torch>=2.5.0",
    "open-clip-torch>=2.32.0",   # CLIP ViT-B-32 (~360 MB modele)
    "face-recognition>=1.3.0",   # dlib HOG/CNN + 128-d encodings
    "scikit-learn>=1.5.0",       # DBSCAN clustering
    "Pillow>=10.0.0",            # PIL Image processing
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# B008 : FastAPI legit pattern (Query/Depends en argument default)
# N806 : SQLAlchemy convention (SessionLocal en PascalCase)
ignore = ["B008", "N806"]

[tool.ruff.lint.per-file-ignores]
# ai.py contient _DB_SCHEMA en triple-quoted SQL avec lignes longues
# photos.py contient des SVG inline avec attributs longs
"src/api/v1/ai.py" = ["E501"]
"src/api/v1/photos.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
